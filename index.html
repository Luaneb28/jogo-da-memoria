<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da memória</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <header>
        <div id="titulo">
            <h1>Jogo da memória</h1>
        </div>
    </header>
    <main class="game">
        <div class="tabuleiro">
            <div class="carta"></div>
            <div class="carta"></div>
            <div class="carta"></div>
            <div class="carta"></div>
            <div class="carta"></div>
            <div class="carta"></div>
            <div class="carta"></div>
            <div class="carta"></div>
            <div class="carta"></div>
            <div class="carta"></div>
        </div>

        <div class="placar">
            <p>Acertos: <span id="acertos">0</span></p>
            <p>Erros: <span id="erros">0</span></p>
        </div>
        
        <div class="botao"><button id="reiniciar">Reiniciar jogo</button></div>
    </main>

    <footer>
        <p>Desafie sua memória • Desenvolvido por Luane Borges</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
